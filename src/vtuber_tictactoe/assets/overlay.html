<!doctype html>
<!-- STREAM-VS-CHAT-OVERLAY v1 -->
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stream vs Chat · Transparent item</title>
<style>
:root{color-scheme:dark;--grid:#e4d3ff;--numbers:#f6eeff;--streamer:#ff91c9;--chat:#7df4dd;--banner_bg:#9c5bea;--banner_text:#ffffff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;display:grid;place-items:center}
#item{width:min(94vw,68vh);opacity:0;transition:opacity .18s;filter:drop-shadow(0 3px 6px #0008);user-select:none}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 1% 5%;font-size:clamp(12px,3vw,34px);font-weight:800;letter-spacing:.03em}
.pink{color:var(--streamer)}.mint{color:var(--chat)}.versus{font-size:.6em;color:#e2ddf9;letter-spacing:.12em}
#status{border:2px solid #d9c9ff8c;border-radius:999px;padding:2% 4%;font-size:.54em;white-space:nowrap;background:#1710229c;color:#fff}
.board{position:relative;display:grid;grid-template-columns:repeat(3,1fr);aspect-ratio:1}
.grid{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 3px var(--grid))}
.grid path{stroke:var(--grid);stroke-width:1.35;stroke-linecap:round;fill:none}
.cell{position:relative;display:grid;place-items:center;aspect-ratio:1}
.number{font-size:clamp(22px,8vw,90px);font-weight:650;color:var(--numbers);opacity:.78;text-shadow:0 2px 4px #000;transition:all .15s}
.cell.filled .number{position:absolute;left:12%;top:8%;font-size:clamp(9px,2vw,24px);opacity:.45}
.mark{position:absolute;inset:20%;width:60%;height:60%;overflow:visible;animation:pop .2s ease-out}
.mark path,.mark circle{stroke-width:9;stroke-linecap:round;fill:none}.mark.x{color:var(--streamer);filter:drop-shadow(0 0 3px var(--streamer))}
.mark.o{color:var(--chat);filter:drop-shadow(0 0 3px var(--chat))}.mark path,.mark circle{stroke:currentColor}
.win{border-radius:20%;background:radial-gradient(ellipse,#fff2,transparent 70%)}
#footer{text-align:center;margin-top:5%;font-size:clamp(11px,2.5vw,28px);font-weight:600;color:#f0e9ff;text-shadow:0 2px 4px #000}
@keyframes pop{from{transform:scale(.65);opacity:.3}to{transform:scale(1);opacity:1}}
#voteBanner{width:100%;margin-top:5%;padding:3% 2%;border-radius:12px;background:var(--banner_bg);color:var(--banner_text);font-size:clamp(12px,3.4vw,38px);font-weight:850;text-align:center;letter-spacing:.045em;visibility:hidden;line-height:1.2}
#voteBanner.voting{visibility:visible;animation:votePulse 1.25s ease-in-out infinite}
#voteBanner.paused{visibility:visible;animation:none;opacity:.7}
@keyframes votePulse{0%,100%{opacity:1;filter:brightness(1.08)}50%{opacity:.38;filter:brightness(.9)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main id="item" aria-label="Stream versus chat tic-tac-toe">
<div class="header"><span class="pink">STREAM <span class="versus">VS</span> <span class="mint">CHAT</span></span><span id="status">READY</span></div>
<div class="board" id="board"><svg class="grid" viewBox="0 0 100 100"><path d="M33.33 3V97 M66.67 3V97 M3 33.33H97 M3 66.67H97"/></svg></div>
<div id="voteBanner" aria-live="polite">CHAT: VOTE</div>
<div id="footer">X · streamer &nbsp; / &nbsp; O · chat</div>
</main><script>
'use strict';
const STATE_URL='__STATE_URL__';
const root=document.getElementById('item'), board=document.getElementById('board');
const preview=new URLSearchParams(location.search).has('preview');
const cells=[];let lastSuccess=0;
for(let i=0;i<9;i++){const c=document.createElement('div');c.className='cell';c.innerHTML='<span class="number">'+(i+1)+'</span>';board.appendChild(c);cells.push(c)}
function render(s){
 if(s.theme)for(const [key,color]of Object.entries(s.theme))document.documentElement.style.setProperty('--'+key,color);
 if(preview)s={...s,visible:true,phase:'chat',paused:false,board:['X','','O','','X','','','',''],winning_line:[],seconds:30,voters:12};
 root.style.opacity=s.visible?'1':'0';
 s.board.forEach((v,i)=>{const c=cells[i];c.classList.toggle('filled',!!v);c.classList.toggle('win',s.winning_line.includes(i));
 if(c.dataset.mark!==v){c.querySelector('.mark')?.remove();if(v){const shape=v==='X'?'<path d="M20 20L80 80 M80 20L20 80"/>':'<circle cx="50" cy="50" r="34"/>';c.insertAdjacentHTML('beforeend','<svg class="mark '+v.toLowerCase()+'" viewBox="0 0 100 100">'+shape+'</svg>')}c.dataset.mark=v}});
 const status=document.getElementById('status'), footer=document.getElementById('footer');
 status.textContent=s.phase==='chat'?(s.paused?'PAUSED':s.seconds+'s · VOTE'):s.phase==='streamer'?"STREAMER'S TURN":s.phase==='over'?'GG ♡':s.phase==='no_votes'?'NO VOTES':'READY';
 footer.textContent=s.phase==='chat'?(s.paused?'Voting paused':'Vote in chat · '+s.voters+' vote'+(s.voters===1?'':'s')):s.phase==='over'?s.message:s.phase==='no_votes'?'Waiting to reopen voting':'X · streamer  /  O · chat';
 const banner=document.getElementById('voteBanner');banner.className=s.phase==='chat'?(s.paused?'paused':'voting'):'';banner.textContent=s.paused?'VOTING PAUSED':'CHAT: VOTE · '+s.seconds+'s';
}
async function poll(){try{const r=await fetch(STATE_URL,{cache:'no-store',signal:AbortSignal.timeout(1800)});if(!r.ok)throw Error();const s=await r.json();lastSuccess=Date.now();render(s)}catch{}setTimeout(poll,250)}
setInterval(()=>{if(Date.now()-lastSuccess>2500)root.style.opacity='0'},300);poll();
</script></body></html>
