name: Test, build, and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  quality:
    name: Tests and static checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check format-check tests
      - run: uv build

  build:
    name: Native ${{ matrix.target }} executable
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: Linux-x64
          - os: windows-2022
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run platform tests
        run: uv run pytest
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libegl1 libopengl0
      - name: Build and test Linux executable with real Qt file dialogs
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run python scripts/build_native.py
      - name: Build and test Windows GUI executable
        if: runner.os == 'Windows'
        run: uv run python scripts/build_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-gui-check-${{ matrix.target }}
          path: build/qa/*
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Transparent item browser checks
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/verify_ui.py

  publish:
    name: Attach executables to GitHub release
    if: >-
      github.event_name == 'release' || (github.event_name == 'push' && github.event.head_commit.message == 'Release v0.2.1: configurable chat vote time')
    needs: [build, browser]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      security-events: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify requested security fix and publish v0.2.1
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state="$(gh api "repos/$GH_REPO/code-scanning/alerts/1" --jq .state)"
          echo "Security alert #1: $state"
          test "$state" = fixed
          gh release create v0.2.1 --target "$GITHUB_SHA" --title "v0.2.1 — Configurable chat vote time" --notes-file RELEASE-NOTES.md
      - name: Upload both platform packages and SHA256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'v0.2.1' }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
